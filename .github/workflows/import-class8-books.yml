name: Import Class 8 textbooks

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/import-class8-books.yml'
      - '.github/scripts/import_class8_books.py'
      - '.github/class8-books-import.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: import-class8-textbooks
  cancel-in-progress: false

jobs:
  import-books:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out Bujhi
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: main
          fetch-depth: 1

      - name: Install PDF import tools
        run: |
          python -m pip install 'gdown==6.0.0'
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils

      - name: Download and verify all 21 non-Science textbooks
        run: python .github/scripts/import_class8_books.py

      - name: Commit uploaded textbooks
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- public/nctb/2026/class-8
          git diff --cached --stat
          git commit -m 'Upload 21 Class 8 NCTB textbooks from Bujhi Team Share'
          git push origin HEAD:main
